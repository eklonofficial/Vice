[build-system] 
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vice"
dynamic = ["version"]
description = "Game clip recorder, like Medal.tv, for Linux (Wayland and X11) and Windows"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "evdev>=1.6.1; sys_platform == 'linux'",
    "aiohttp>=3.9.0",
    "click>=8.1.7",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "psutil>=5.9.0",
    "pywebview>=5.0",
    # WASAPI loopback for desktop audio; Windows has no PipeWire to ask.
    "soundcard>=0.4.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Flatpak builds use the system WebKit; skip pywebview install there
no-webview = []

[project.scripts]
vice     = "vice.main:cli"
vice-app = "vice.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vice*"]

[tool.setuptools.dynamic]
version = {attr = "vice.__version__"}

[tool.setuptools.package-data]
vice = ["ui/*", "ui/fonts/*", "ui/styles/*", "ui/scripts/*", "data/*.json", "fonts/*"]

# Vice as a Flatpak, built from this repository at the commit being built, so
# it is the same code as every other install. Releases build this in CI (see
# .github/workflows/flatpak.yml). Recording goes through the official
# gpu-screen-recorder Flatpak on the host, which Vice offers to install.
id: io.github.splitshotz.Vice
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# PyQt6 and QtWebEngine, for the pywebview window.
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.11'
command: vice-app

finish-args:
  - --share=network
  - --share=ipc
  # X11 for xdotool/xprop/wmctrl and XWayland game windows, Wayland for the
  # window itself and the layer-shell keyboard overlay.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  # The GPU for the window, and /dev/input for the global hotkeys. --device=input
  # is newer than the flatpak on some SteamOS releases, so all is used.
  - --device=all
  # Clips can be saved anywhere the user picks, Steam libraries are read for
  # game names, and the config is shared with a native install.
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  # Discord Rich Presence, for the native and the Flatpak Discord.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:ro
  # Host commands: the gpu-screen-recorder Flatpak, compositor tools
  # (hyprctl, swaymsg, niri, kdotool) and /proc lookups for window pids.
  - --talk-name=org.freedesktop.Flatpak
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Chromium's own sandbox cannot nest inside bwrap.
  - --env=QTWEBENGINE_DISABLE_SANDBOX=1
  # The base app keeps the Chromium helper in /app, where Qt does not look.
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess

cleanup-commands:
  - /app/cleanup-BaseApp.sh
  # Spell-check dictionaries from the QtWebEngine base: Vice has no text field
  # that needs them, and they were half the size of the app. They come from
  # the base, so the cleanup list below does not reach them.
  - rm -rf /app/share/locale/*/qtwebengine_dictionaries /app/qtwebengine_dictionaries

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # wmctrl and xclip need it, and the runtime does not ship it.
  - name: libXmu
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/lib/libXmu-1.2.1.tar.xz
        sha256: fcb27793248a39e5fcc5b9c4aec40cc0734b3ca76aac3d7d1c264e7f7e14e8b2

  - name: xprop
    sources:
      - type: archive
        url: https://www.x.org/releases/individual/app/xprop-1.2.8.tar.xz
        sha256: d689e2adb7ef7b439f6469b51cda8a7daefc83243854c2a3b8f84d0f029d67ee

  - name: xdotool
    buildsystem: simple
    build-commands:
      - make PREFIX=${FLATPAK_DEST} WITHOUT_RPATH_FIX=1
      - make PREFIX=${FLATPAK_DEST} WITHOUT_RPATH_FIX=1 install
    sources:
      - type: archive
        url: https://github.com/jordansissel/xdotool/releases/download/v3.20211022.1/xdotool-3.20211022.1.tar.gz
        sha256: 96f0facfde6d78eacad35b91b0f46fecd0b35e474c03e00e30da3fdd345f9ada

  - name: wmctrl
    sources:
      - type: archive
        url: https://deb.debian.org/debian/pool/main/w/wmctrl/wmctrl_1.07.orig.tar.gz
        sha256: d78a1efdb62f18674298ad039c5cbdb1edb6e8e149bb3a8e3a01a4750aa3cca9

  - name: xclip
    sources:
      - type: archive
        url: https://github.com/astrand/xclip/archive/refs/tags/0.13.tar.gz
        sha256: ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758

  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/refs/tags/v2.3.0.tar.gz
        sha256: b4dc560973f0cd74e02f817ffa2fd44ba645a4f1ea94b7b9614dacc9f895f402

  # The keyboard overlay is a GTK3 layer-shell window driven from Python.
  - name: pycairo
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/pygobject/pycairo/releases/download/v1.28.0/pycairo-1.28.0.tar.gz
        sha256: 26ec5c6126781eb167089a123919f87baa2740da2cca9098be8b3a6b91cc5fbc

  - name: pygobject
    buildsystem: meson
    config-opts:
      - -Dtests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pygobject/3.50/pygobject-3.50.2.tar.gz
        sha256: ece6b860aab77cb649fdfc6e88d8a83765e7a62f7ffd39a628d6e2a0d397a7ff

  - name: gtk-layer-shell
    buildsystem: meson
    config-opts:
      - -Dvapi=false
      - -Dtests=false
      - -Dexamples=false
      - -Ddocs=false
    sources:
      - type: archive
        url: https://github.com/wmww/gtk-layer-shell/archive/refs/tags/v0.10.1.tar.gz
        sha256: 88c3a3e0a5300532f3d368d5df64838a87f1fb85273f22d41df0a6b8d0ec59c6

  - name: cloudflared
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - install -Dm755 cloudflared-linux-amd64 ${FLATPAK_DEST}/bin/cloudflared
    sources:
      - type: file
        url: https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64
        sha256: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872

  # Python dependencies of Vice. Wheels for Python 3.13 on x86_64, except evdev
  # and proxy_tools, which only publish source.
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links=file://${PWD} --prefix=${FLATPAK_DEST}
